<title>HackaTone Health</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column app shell. Registration first, then a profile strip, level switch and four tabs. */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface2:#E8EEEA;--ink:#14211C;--muted:#566860;--line:#D3DDD7;
  --accent:#0E7C61;--on-accent:#FFFFFF;
  --easy:#2F7FC4;--mid:#C58A0F;--strong:#C2412D;
  --easy-bg:#E2EEF9;--mid-bg:#FBEFD6;--strong-bg:#F8E1DB;
  --good:#17724B;--good-bg:#DCF0E5;--warn:#85560A;--warn-bg:#FAEBC9;--bad:#A02D1D;--bad-bg:#F7DCD6;
  --band:#D9E9E1;
  --f-display:'Familjen Grotesk',system-ui,sans-serif;--f-body:'Public Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1713;--surface:#15231D;--surface2:#1C2D26;--ink:#E6EFEA;--muted:#9AB0A6;--line:#27392F;
  --accent:#3FCB9F;--on-accent:#06261C;
  --easy:#6DB1F1;--mid:#E5B24D;--strong:#EE8070;
  --easy-bg:#16293A;--mid-bg:#33290F;--strong-bg:#3A1F1A;
  --good:#6EDBA6;--good-bg:#173A2A;--warn:#EBC066;--warn-bg:#3A2E10;--bad:#F29A8C;--bad-bg:#42201B;
  --band:#1D3329;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1713;--surface:#15231D;--surface2:#1C2D26;--ink:#E6EFEA;--muted:#9AB0A6;--line:#27392F;
  --accent:#3FCB9F;--on-accent:#06261C;
  --easy:#6DB1F1;--mid:#E5B24D;--strong:#EE8070;
  --easy-bg:#16293A;--mid-bg:#33290F;--strong-bg:#3A1F1A;
  --good:#6EDBA6;--good-bg:#173A2A;--warn:#EBC066;--warn-bg:#3A2E10;--bad:#F29A8C;--bad-bg:#42201B;
  --band:#1D3329;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1040px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--accent);position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:3px;background:var(--on-accent);box-shadow:0 -6px 0 var(--on-accent),0 -12px 0 var(--on-accent)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* registration */
.reg{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:start;padding-block:12px 8px}
.reg .intro{display:flex;flex-direction:column;gap:20px;min-width:0}
.levels{display:flex;flex-direction:column;gap:10px}
.lv{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px}
.dot.easy,.d-easy{background:var(--easy)}.dot.mid,.d-mid{background:var(--mid)}.dot.strong,.d-strong{background:var(--strong)}
form .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
input[type=text],input[type=tel],input[type=date],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.radios{display:flex;gap:10px}
.radios label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-weight:500;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:18px}
@media(max-width:760px){.reg{grid-template-columns:1fr}form .fields{grid-template-columns:1fr}}
/* dashboard */
.profile{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;padding-block:8px 18px}
.facts{display:flex;gap:22px;flex-wrap:wrap}
.fact b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:18px 18px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.big{font-family:var(--f-mono);font-size:32px;font-weight:500;line-height:1.1}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neutral{background:var(--surface2);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.lv-easy.sel{background:var(--easy-bg)}td.lv-mid.sel{background:var(--mid-bg)}td.lv-strong.sel{background:var(--strong-bg)}
th .dot{display:inline-block;margin:0 6px 0 0;vertical-align:middle}
.cell b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.badge .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);border:2px dashed var(--line)}
.badge.on{border-color:var(--accent)}
.badge.on .medal{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .ax{stroke:var(--line)}
.chart .med{stroke:var(--accent);fill:none;stroke-width:2}
.chart .edge{stroke:var(--muted);fill:none;stroke-width:1;stroke-dasharray:4 4}
.chart .band{fill:var(--band)}
.chart .pt{fill:var(--ink)}
.chart .pt.last{fill:var(--strong);stroke:var(--surface);stroke-width:2}
ul.plain{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
footer.disc{margin-top:28px}
@media (prefers-reduced-motion:no-preference){.card,.badge{transition:border-color .15s}}
/* landing */
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.langs button{background:none;border:0;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center;padding-block:28px 40px}
.hero-h{font-size:clamp(32px,6vw,54px);letter-spacing:-.02em}
.lead{font-size:17px;max-width:54ch}
.sec{padding-block:28px}
.how{display:flex;flex-direction:column;gap:10px}
.num-chip{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;font-weight:500;flex:none}
.lvcard{display:flex;flex-direction:column;gap:8px}
.feat{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:28px}
.cta{margin-block:28px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:32px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
/* wizard */
.wz{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
@media(max-width:860px){.wz{grid-template-columns:1fr}}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;color:var(--muted);font-weight:600;font-size:13px}
.stp .num-chip{background:var(--surface2);color:var(--muted);width:24px;height:24px;font-size:12px}
.stp.cur{border-color:var(--ink);color:var(--ink)}
.stp.cur .num-chip{background:var(--ink);color:var(--bg)}
.stp.done .num-chip{background:var(--accent);color:var(--on-accent)}
.stp:disabled{opacity:.5;cursor:not-allowed}
.pv{position:sticky;top:env(safe-area-inset-top,0px)}
@media(max-width:860px){.pv{position:static}}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.review dd{text-align:right}
/* telegram */
.tg-grid{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start;margin-top:20px}
@media(max-width:700px){.tg-grid{grid-template-columns:1fr}}
.codebig{font-size:clamp(34px,8vw,48px);font-weight:500;letter-spacing:.12em;margin:6px 0 0;line-height:1.1}
.qrbox{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:100%}
.qr{background:#FFFFFF;padding:14px;border-radius:10px;width:min(240px,100%);border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-weight:500;cursor:pointer}
input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.payload{margin:12px 0 0;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.5}
</style>

<script>
(function(){
'use strict';
var H=window.HH={};
/* Approximate WHO 2007 growth reference, ages 5-19 (median, SD, BMI median, growth velocity cm/yr at ages 5..20) */
H.WHO={
  M:{h:[109.2,115.5,121.7,127.3,132.6,137.8,143.1,149.1,156.0,163.2,169.0,172.9,175.2,176.1,176.5],
     sd:[4.7,5.0,5.3,5.6,5.9,6.2,6.7,7.3,7.9,7.6,7.0,6.6,6.4,6.4,6.4],
     bmi:[15.3,15.3,15.5,15.8,16.1,16.5,17.0,17.5,18.1,18.8,19.5,20.0,20.5,20.9,21.2],
     vel:[6.0,5.8,5.6,5.5,5.4,5.5,6.0,7.0,8.2,7.2,4.5,2.5,1.2,0.5,0.2,0]},
  F:{h:[109.4,115.1,121.0,126.6,132.5,138.6,144.8,151.2,156.7,159.8,161.2,162.0,162.5,162.9,163.1],
     sd:[4.6,4.9,5.2,5.6,6.0,6.4,6.6,6.4,6.0,5.9,5.8,5.8,5.8,5.9,5.9],
     bmi:[15.2,15.2,15.4,15.8,16.3,16.9,17.5,18.2,18.9,19.5,20.0,20.4,20.7,20.9,21.0],
     vel:[6.0,5.8,5.6,5.7,6.0,6.8,7.0,5.2,3.0,1.8,1.0,0.5,0.2,0,0,0]}
};
function at(arr,age){var a=Math.min(19,Math.max(5,age));var i=Math.min(13,Math.floor(a-5));var t=a-5-i;return arr[i]+(arr[i+1]-arr[i])*t}
function velAt(arr,age){if(age>=20)return 0;var a=Math.max(5,age);var i=Math.min(14,Math.floor(a-5));var t=a-5-i;return arr[i]+(arr[i+1]-arr[i])*t}
function cdf(z){var t=1/(1+0.2316419*Math.abs(z));var d=0.3989423*Math.exp(-z*z/2);var p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
H.at=at;H.velAt=velAt;
H.LV={easy:{pal:1.45,f:0.9},mid:{pal:1.65,f:1.0},strong:{pal:1.85,f:1.05}};
H.ORDER=['easy','mid','strong'];
H.ymd=function(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day};
H.ageAt=function(dob,date){return (date-new Date(dob+'T00:00:00'))/(365.25*864e5)};
H.r1=function(n){return Math.round(n*10)/10};

/* p = {dob, sex}, m = {h, w} */
H.analyze=function(p,m){
  var age=H.ageAt(p.dob,new Date()),T=H.WHO[p.sex],youth=age<19;
  var med=at(T.h,age),sd=at(T.sd,age),z=(m.h-med)/sd;
  var pct=Math.min(99,Math.max(1,Math.round(cdf(z)*100)));
  var hs=z<-2?{k:'low2',c:'bad'}:z<-1?{k:'low1',c:'warn'}:z<=1?{k:'typ',c:'good'}:z<=2?{k:'high1',c:'warn'}:{k:'high2',c:'bad'};
  var bmi=m.w/Math.pow(m.h/100,2),bLow,bHigh,bObese,bm=at(T.bmi,age);
  if(youth){var q=(Math.min(age,19)-5)/14;bLow=bm*(0.85-0.075*q);bHigh=bm*(1.09+0.11*q);bObese=bm*(1.20+0.20*q)}
  else{bLow=18.5;bHigh=24.9;bObese=30}
  var bs=bmi<bLow?{k:'under',c:'warn'}:bmi<=bHigh?{k:'ok',c:'good'}:bmi<bObese?{k:'over',c:'warn'}:{k:'obese',c:'bad'};
  var hm=Math.pow(m.h/100,2);
  var adultH=at(T.h,19)+z*at(T.sd,19);
  var endAge=p.sex==='F'?17:19;
  var remaining=youth&&age<endAge?Math.max(0,adultH-m.h):0;
  return {p:p,m:m,age:age,youth:youth,T:T,med:med,sd:sd,z:z,pct:pct,hs:hs,bmi:bmi,bLow:bLow,bHigh:bHigh,bs:bs,
    kgLow:bLow*hm,kgHigh:bHigh*hm,adultH:adultH,remaining:remaining,growable:remaining>=1,endAge:endAge,
    vel:youth?velAt(T.vel,age):0};
};
function bmr(sex,age,w){var M=sex==='M';
  if(age<10)return M?22.7*w+495:22.5*w+499;
  if(age<18)return M?17.5*w+651:12.2*w+746;
  if(age<30)return M?15.3*w+679:14.7*w+496;
  if(age<60)return M?11.6*w+879:8.7*w+829;
  return M?13.5*w+487:10.5*w+596}
H.plan=function(a,lv){
  var w=a.m.w,k=bmr(a.p.sex,a.age,w)*H.LV[lv].pal,sk=a.bs.k;
  if(a.youth){if(sk==='under')k*=1.05}
  else{if(sk==='under')k*=1.10;else if(sk==='over')k*=0.90;else if(sk==='obese')k*=0.85}
  k=Math.round(k/50)*50;
  var pk=a.youth?{easy:1.0,mid:1.1,strong:1.2}[lv]:{easy:1.0,mid:1.3,strong:1.6}[lv];
  var prot=Math.round(pk*Math.min(w,a.kgHigh)),fat=Math.round(k*0.28/9),carb=Math.round((k-prot*4-fat*9)/4);
  var ca=a.age<7?600:a.age<10?700:a.age<19?1300:1000;
  var water=a.youth?(a.age<9?1.6:a.age<14?1.9:2.3):Math.round(w*0.033*10)/10;
  return {kcal:k,prot:prot,carb:carb,fat:fat,ca:ca,water:water};
};
H.recommended=function(a){return a.bs.k==='ok'?'mid':'easy'};

H.PATTERNS={
  easy:[['cardio',30],['stretch',20],['rest',0],['cardio',30],['strength',25],['sport',45],['rest',0]],
  mid:[['cardio',40],['strength',40],['stretch',30],['cardio',45],['strength',40],['sport',60],['recover',30]],
  strong:[['cardio',50],['strength',60],['sport',50],['strength',60],['cardio',50],['sport',75],['stretch',30]]
};
/* [name key, grams or null, pieces] ; meals: [meal key, % of daily kcal, items] */
H.MENU={
  easy:[
    ['breakfast',25,[['oat',250],['egg',null,1],['apple',null,1]]],
    ['snack',10,[['kefir',200],['apricot',30]]],
    ['lunch',30,[['lentil',300],['rice',120],['cucsalad',150],['nonwg',40]]],
    ['snack',10,[['tvorog',100],['fruit',150]]],
    ['dinner',25,[['chicken',120],['steamveg',200],['potato',150]]]
  ],
  mid:[
    ['breakfast',25,[['omelet',null,2],['nonwg',60],['tvorog',80],['fruit',150]]],
    ['snack',10,[['yogurt',150],['walnut',20],['banana',null,1]]],
    ['lunch',30,[['shurpa',350],['buckwheat',150],['mixsalad',150],['non',50]]],
    ['snack',10,[['egg',null,1],['nutsfruit',40],['kefir',200]]],
    ['dinner',25,[['fish',150],['brownrice',150],['veg',200]]]
  ],
  strong:[
    ['breakfast',25,[['oatnuts',300],['egg',null,3],['apricot',30]]],
    ['snack',10,[['tvorog',150],['honey',15],['fruit',150]]],
    ['lunch',30,[['plov',350],['vegsalad',200],['yogurt',150],['non',60]]],
    ['snack',10,[['egg',null,2],['nuts',30],['banana',null,1]]],
    ['dinner',25,[['grill',180],['rb',200],['veg',250],['kefir',200]]]
  ]
};
H.simulate=function(a,f,targets){
  var V=a.T.vel,raw=0,i;
  for(i=0;i<240;i++)raw+=velAt(V,a.age+i/12)/12;
  var out=targets.map(function(){return null});
  if(raw<=0)return out;
  var s=Math.min(1.5,Math.max(0.6,a.remaining/raw)),cum=0;
  for(i=1;i<=240;i++){cum+=velAt(V,a.age+(i-1)/12)*s*f/12;
    for(var k=0;k<targets.length;k++){if(out[k]===null&&cum>=targets[k])out[k]=i}}
  return out;
};
H.gainTargets=function(a){
  var all=[1,2,3,5,8,10,15],lim=a.remaining*0.85,t=all.filter(function(x){return x<=lim});
  if(!t.length&&a.remaining>=1)t=[1];
  return t.slice(0,5);
};
H.fmtPhone=function(raw){
  var d=raw.replace(/\D/g,'');
  if(d.length===9)d='998'+d;
  if(d.length<9||d.length>15)return null;
  if(d.indexOf('998')===0&&d.length===12)return '+998 '+d.slice(3,5)+' '+d.slice(5,8)+' '+d.slice(8,10)+' '+d.slice(10);
  return '+'+d;
};
})();

<script>
(function(){
'use strict';
var H=window.HH,A=window.APP={};
var KEY='hackatone-health-v2';

A.state={lang:null,screen:'landing',profile:null,meas:[],level:null,tab:'overview',confirmReset:false,wz:blankWz(),tg:null,bot:''};
A.blankWz=blankWz;
try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&typeof s==='object'){
  if(s.lang)A.state.lang=s.lang;
  if(s.profile&&s.meas&&s.meas.length){A.state.profile=s.profile;A.state.meas=s.meas;A.state.level=s.level||null;A.state.tab=s.tab||'overview';A.state.screen='dash'}

  if(s.tg&&s.tg.code)A.state.tg=s.tg;if(typeof s.bot==='string')A.state.bot=s.bot;
}}}catch(e){}
if(!A.state.lang||!window.LANG[A.state.lang]){
  var nl=((navigator.language||'en')+'').toLowerCase();
  A.state.lang=nl.indexOf('ru')===0?'ru':nl.indexOf('uz')===0?'uz':'en';
}
A.save=function(){try{localStorage.setItem(KEY,JSON.stringify(A.state))}catch(e){}};
A.$=function(s){return document.querySelector(s)};
A.esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function dict(){return window.LANG[A.state.lang]||window.LANG.en}
A.t=function(key){
  var s=dict()[key];if(s==null)s=window.LANG.en[key];if(s==null)return key;
  var args=arguments;
  return s.replace(/\{(\d+)\}/g,function(m,i){var v=args[+i+1];return v==null?m:v});
};
var plCache={};
A.tn=function(key,n){
  var L=dict(),s=L[key];if(s==null)s=window.LANG.en[key];
  var f=plCache[A.state.lang]||(plCache[A.state.lang]=new Function('n','return '+L.plural));
  var parts=s.split('|'),i=Math.min(Number(f(n)),parts.length-1);
  return parts[i].replace('{0}',n);
};
A.monthsLabel=function(n){if(n==null)return '-';return n<24?A.tn('mo',n):A.t('yr',(n/12).toFixed(1))};
A.dateLabel=function(n){
  var d=new Date();d.setMonth(d.getMonth()+n);
  try{return d.toLocaleDateString(dict().locale,{month:'short',year:'numeric'})}catch(e){return H.ymd(d)}
};
A.lvName=function(l){return A.t('lv.'+l)};
A.langSwitch=function(){
  return '<div class="langs" role="group" aria-label="Language">'+[['uz','UZ'],['en','EN'],['ru','RU']].map(function(l){
    return '<button data-act="lang" data-v="'+l[0]+'" aria-pressed="'+(A.state.lang===l[0])+'">'+l[1]+'</button>'}).join('')+'</div>';
};
A.brand='<div class="brand"><i></i>HackaTone Health</div>';

/* Height chart. pts = [{ag,h}] */
A.chartSvg=function(a,pts){
  var t=A.t,T=a.T,W=640,Hh=320,L=46,R=44,Tp=14,B=40;
  var x=function(g){return L+(g-5)/14*(W-L-R)};
  var y=function(h){return Hh-B-(Math.min(200,Math.max(100,h))-100)/100*(Hh-Tp-B)};
  var ages=[];for(var g=5;g<=19.001;g+=0.5)ages.push(g);
  var line=function(k){return ages.map(function(g,i){return (i?'L':'M')+x(g).toFixed(1)+' '+y(H.at(T.h,g)+k*H.at(T.sd,g)).toFixed(1)}).join('')};
  var up=ages.map(function(g){return x(g).toFixed(1)+' '+y(H.at(T.h,g)+2*H.at(T.sd,g)).toFixed(1)});
  var lo=ages.slice().reverse().map(function(g){return x(g).toFixed(1)+' '+y(H.at(T.h,g)-2*H.at(T.sd,g)).toFixed(1)});
  var s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+A.esc(t('ch.aria'))+'">';
  for(var h=100;h<=200;h+=20)s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(h)+'" y2="'+y(h)+'"/><text x="'+(L-8)+'" y="'+(y(h)+4)+'" text-anchor="end">'+h+'</text>';
  for(var ag=5;ag<=19;ag+=2)s+='<text x="'+x(ag)+'" y="'+(Hh-B+18)+'" text-anchor="middle">'+ag+'</text>';
  s+='<text x="'+((L+W-R)/2)+'" y="'+(Hh-6)+'" text-anchor="middle">'+A.esc(t('ch.age'))+'</text><text x="4" y="10">'+t('u.cm')+'</text>';
  s+='<path class="band" d="M'+up.concat(lo).join('L')+'Z"/><path class="edge" d="'+line(2)+'"/><path class="edge" d="'+line(-2)+'"/><path class="med" d="'+line(0)+'"/>';
  s+='<text x="'+(W-R+6)+'" y="'+(y(H.at(T.h,19)+2*H.at(T.sd,19))+4)+'">+2 SD</text><text x="'+(W-R+6)+'" y="'+(y(H.at(T.h,19))+4)+'">'+A.esc(t('ch.median'))+'</text><text x="'+(W-R+6)+'" y="'+(y(H.at(T.h,19)-2*H.at(T.sd,19))+4)+'">-2 SD</text>';
  pts.forEach(function(q,i){var last=i===pts.length-1;s+='<circle class="pt'+(last?' last':'')+'" cx="'+x(q.ag).toFixed(1)+'" cy="'+y(q.h).toFixed(1)+'" r="'+(last?6:4)+'"/>'});
  return s+'</svg>';
};
A.newCode=function(){var n;try{var u=new Uint32Array(1);crypto.getRandomValues(u);n=100000+(u[0]%900000)}catch(e){n=100000+Math.floor(Math.random()*900000)}return String(n)};
A.ensureTg=function(){var S=A.state;if(!S.tg||!S.tg.code)S.tg={code:A.newCode(),rem:{workout:true,meals:true,water:false,measure:true},time:'18:00'};return S.tg};
A.botName=function(){return (A.state.bot||'').replace(/^@/,'').trim()};
A.tgLink=function(){var b=A.botName();return /^[A-Za-z][A-Za-z0-9_]{3,31}$/.test(b)?'https://t.me/'+b+'?start='+A.state.tg.code:''};
A.qrHtml=function(){
  var link=A.tgLink();

};
A.tgPayload=function(){var S=A.state,tg=S.tg;return JSON.stringify({phone:S.profile&&S.profile.phone,code:tg.code,lang:S.lang,level:S.level,reminders:tg.rem,time:tg.time},null,2)};
A.measPts=function(a){
  return A.state.meas.map(function(m){return {ag:H.ageAt(a.p.dob,new Date(m.date+'T00:00:00')),h:m.h}}).filter(function(q){return q.ag>=5&&q.ag<=19});
};

D.strip=function(a){

D.tg=function(a){

  '<div class="tg-grid"><div class="stack"><div><span class="label">'+t('tg.code')+'</span><p class="codebig mono" id="codebig">'+tg.code.replace(/(\d{3})(\d{3})/,'$1 $2')+'</p></div>'+
  '<div class="row"><button class="btn ghost sm" data-act="copy">'+t('tg.copy')+'</button><button class="btn ghost sm" data-act="regen">'+t('tg.regen')+'</button></div>'+
  '<label class="f" for="botname">'+t('tg.bot')+'<input id="botname" type="text" value="'+esc(S.bot)+'" placeholder="'+t('tg.botph')+'" autocomplete="off" autocapitalize="off" spellcheck="false"></label>'+
  '<ol class="steps"><li>'+t('tg.s1')+'</li><li>'+t('tg.s2')+'</li><li>'+t('tg.s3')+'</li></ol></div>'+
  '<div id="qrbox" class="qrbox">'+A.qrHtml()+'</div></div></div>'+
  '<div class="card"><h3>'+t('tg.rem')+'</h3><div class="chks">'+['workout','meals','water','measure'].map(chk).join('')+'</div>'+
  '<label class="f" for="remtime" style="margin-top:14px;max-width:200px">'+t('tg.time')+'<input id="remtime" type="time" value="'+esc(tg.time)+'"></label></div>'+
  '<div class="card"><h3>'+t('tg.payload')+'</h3><pre class="payload mono" id="payload">'+esc(A.tgPayload())+'</pre></div>'+
  '<p class="note">'+t('tg.note')+'</p></div>';
};

D.overview=function(a){
  var S=A.state;
  var heightCard='<div class="card"><span class="label">'+t('ov.height')+'</span><div class="row" style="margin-top:8px;justify-content:space-between"><span class="big">'+a.m.h+' '+t('u.cm')+'</span><span class="pill '+a.hs.c+'">'+t('hs.'+a.hs.k)+'</span></div>'+
  '<dl class="kv"><dt>'+t('ov.median',a.age.toFixed(1))+'</dt><dd>'+r1(a.med)+' '+t('u.cm')+'</dd><dt>'+t('ov.range')+'</dt><dd>'+Math.round(a.med-2*a.sd)+' – '+Math.round(a.med+2*a.sd)+' '+t('u.cm')+'</dd><dt>'+t('ov.pct')+'</dt><dd>P'+a.pct+'</dd></dl>'+
  (a.hs.c==='bad'?'<p class="note" style="margin-top:12px">'+t('ov.doctor')+'</p>':'')+'</div>';
  var diff=a.m.w<a.kgLow?t('ov.plus',r1(a.kgLow-a.m.w)):a.m.w>a.kgHigh?t('ov.minus',r1(a.m.w-a.kgHigh)):t('ov.inrange');
  var weightCard='<div class="card"><span class="label">'+t('ov.weight')+'</span><div class="row" style="margin-top:8px;justify-content:space-between"><span class="big">'+a.bmi.toFixed(1)+'</span><span class="pill '+a.bs.c+'">'+t('bs.'+a.bs.k)+'</span></div>'+
  '<dl class="kv"><dt>'+t('ov.bmirange')+'</dt><dd>'+r1(a.bLow)+' – '+r1(a.bHigh)+'</dd><dt>'+t('ov.hw',a.m.h)+'</dt><dd>'+r1(a.kgLow)+' – '+r1(a.kgHigh)+' '+t('u.kg')+'</dd><dt>'+t('ov.yourw')+'</dt><dd>'+a.m.w+' '+t('u.kg')+', '+diff+'</dd></dl>'+
  '<p class="small muted" style="margin-top:12px">'+t(a.youth?'ov.bminote.y':'ov.bminote.a')+'</p></div>';
  var grow;
  if(a.growable){
    grow='<div class="card"><span class="label">'+t('gr.title')+'</span><div class="row" style="margin-top:8px;justify-content:space-between"><span class="big">'+Math.round(a.adultH)+' '+t('u.cm')+'</span><span class="pill good">'+t('gr.still')+'</span></div>'+
    '<p class="small muted" style="margin-top:4px">'+t('gr.proj')+'</p>'+
    '<dl class="kv"><dt>'+t('gr.rem')+'</dt><dd>'+t('gr.remv',r1(a.remaining))+'</dd><dt>'+t('gr.vel')+'</dt><dd>'+t('gr.velv',r1(a.vel))+'</dd><dt>'+t('gr.end')+'</dt><dd>'+t('gr.endv',a.endAge)+'</dd></dl>'+
    '<p class="small muted" style="margin-top:12px">'+t('gr.genes')+'</p></div>';
  }else{
    grow='<div class="card"><span class="label">'+t('gr.title')+'</span><div class="row" style="margin-top:8px;justify-content:space-between"><span class="big">'+t('gr.complete')+'</span><span class="pill neutral">'+t(a.youth?'gr.near':'gr.adult')+'</span></div>'+
    '<p style="margin-top:10px">'+t('gr.closed')+'</p><p class="small muted" style="margin-top:8px">'+t('gr.posture')+'</p></div>';
  }
  var sleep=a.age<14?'9–11':a.age<18?'8–10':'7–9';
  var pl=H.plan(a,S.level);
  var chart=a.youth?'<div class="card"><div class="row" style="justify-content:space-between"><h3>'+t('ch.title')+'</h3><span class="small muted">'+t('ch.sub')+'</span></div>'+A.chartSvg(a,A.measPts(a))+'</div>':'';
  var daily='<div class="card"><h3>'+t('dt.title')+'</h3><div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))">'+
  '<div><span class="label">'+t('dt.sleep')+'</span><p class="mono" style="font-size:18px">'+sleep+' '+t('u.h')+'</p></div>'+
  '<div><span class="label">'+t('dt.act')+'</span><p class="mono" style="font-size:18px">'+t(a.youth?'dt.actv.y':'dt.actv.a')+'</p></div>'+
  '<div><span class="label">'+t('dt.ca')+'</span><p class="mono" style="font-size:18px">'+pl.ca+' '+t('u.mg')+'</p></div>'+
  '<div><span class="label">'+t('dt.water')+'</span><p class="mono" style="font-size:18px">'+pl.water+' '+t('u.l')+'</p></div></div></div>';
  return '<div class="stack"><div class="grid">'+heightCard+weightCard+grow+'</div>'+chart+daily+'<p class="note">'+t('ov.note')+'</p></div>';
};

function detail(type,lv,a){
  var y=a.youth;
  if(type==='cardio')return t('dx.cardio.'+(y?'y':'a')+'.'+lv);
  if(type==='strength'){
    if(y)return t(lv==='strong'?'dx.strength.y.strong':'dx.strength.y',t('sets.'+lv));
    return t('dx.strength.a',t('sets.'+lv));
  }
  if(type==='stretch')return t(a.growable?'dx.stretch.g':'dx.stretch.n');
  if(type==='sport')return t(y?'dx.sport.y':'dx.sport.a');
  if(type==='recover')return t('dx.recover');
  return t('dx.rest');
}
D.training=function(a){
  var lv=A.state.level,pat=H.PATTERNS[lv],total=0,sessions=0;
  var rows=pat.map(function(d,i){total+=d[1];if(d[1]>0&&d[0]!=='recover')sessions++;
    return '<tr><td><b>'+t('d.'+i)+'</b></td><td>'+t('ty.'+d[0])+'</td><td class="num">'+(d[1]?d[1]:'-')+'</td><td>'+detail(d[0],lv,a)+'</td></tr>'}).join('');
  var who,cls;
  if(a.youth){who=t('tr.whoy',Math.max(0,Math.ceil((420-total)/7)));cls='neutral'}
  else{who=t(total<150?'tr.who.low':total<=300?'tr.who.ok':'tr.who.high');cls=total<150?'warn':'good'}
  var gb='';
  if(a.growable){var sl=a.age<14?'9–11':'8–10';
    gb='<div class="card"><h3>'+t('gb.title')+'</h3><ul class="plain"><li>'+t('gb.1',sl)+'</li><li>'+t('gb.2')+'</li><li>'+t('gb.3')+'</li><li>'+t('gb.4')+'</li><li>'+t('gb.5')+'</li></ul></div>';}
  return '<div class="stack"><div class="card"><div class="row" style="justify-content:space-between"><div><span class="label">'+t('lvtag.'+lv)+'</span><h2>'+t('tr.title',A.lvName(lv))+'</h2></div>'+
  '<div class="row"><span class="pill neutral mono">'+t('tr.min',total)+'</span><span class="pill neutral mono">'+t('tr.sessions',sessions)+'</span></div></div>'+
  '<p class="small muted" style="margin-top:10px"><span class="pill '+cls+'" style="margin-right:6px">'+t('tr.who')+'</span>'+who+'</p></div>'+
  '<div class="tablewrap"><table><thead><tr><th>'+t('tr.day')+'</th><th>'+t('tr.session')+'</th><th class="num">'+t('tr.mins')+'</th><th>'+t('tr.todo')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+gb+
  '<p class="note">'+t('tr.note')+'</p></div>';
};

function portion(it,f){
  var name=t('f.'+it[0]);
  if(it[1]==null){var n=Math.max(1,Math.round(it[2]*f));return n+' × '+esc(name.charAt(0).toLowerCase()===name.charAt(0)?name:name)}
  var g=Math.max(5,Math.round(it[1]*f/5)*5);return esc(name)+' <span class="mono muted">'+g+' '+(A.state.lang==='ru'?'г':A.state.lang==='uz'?'g':'g')+'</span>';
}
D.feeding=function(a){
  var lv=A.state.level,pl=H.plan(a,lv),f=pl.kcal/2000;
  var cmp=ORDER.map(function(l){var q=H.plan(a,l);return '<div class="lv"><span class="dot d-'+l+'"></span><div><b>'+A.lvName(l)+'</b><p class="mono small">'+t('fd.cmpline',q.kcal,q.prot)+'</p></div></div>'}).join('');
  var rows=H.MENU[lv].map(function(s){return '<tr><td><b>'+t('m.'+s[0])+'</b></td><td class="num">'+Math.round(pl.kcal*s[1]/100)+'</td><td>'+s[2].map(function(it){return portion(it,f)}).join('<br>')+'</td></tr>'}).join('');
  var adj=a.youth?t(a.bs.k==='under'?'fd.adj.y.under':'fd.adj.y'):t('fd.adj.'+a.bs.k);
  var stat=function(lab,val,unit){return '<div><span class="label">'+lab+'</span><p class="big">'+val+'</p><p class="small muted">'+unit+'</p></div>'};
  return '<div class="stack"><div class="card"><div><span class="label">'+t('lvtag.'+lv)+'</span><h2>'+t('fd.title',A.lvName(lv))+'</h2></div>'+
  '<div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))">'+
  stat(t('fd.energy'),pl.kcal,t('u.kcalday'))+stat(t('fd.protein'),pl.prot,t('u.gday'))+stat(t('fd.carbs'),pl.carb,t('u.gday'))+
  stat(t('fd.fat'),pl.fat,t('u.gday'))+stat(t('fd.calcium'),pl.ca,t('u.mgday'))+stat(t('fd.water'),pl.water,t('u.lday'))+'</div>'+
  '<p class="small muted" style="margin-top:12px">'+adj+'</p></div>'+
  '<div class="tablewrap"><table><thead><tr><th>'+t('fd.meal')+'</th><th class="num">'+t('fd.kcal')+'</th><th>'+t('fd.menu')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div class="card"><h3>'+t('fd.cmp')+'</h3><div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))">'+cmp+'</div></div>'+
  '<p class="note">'+t('fd.note',H.LV.easy.pal,H.LV.mid.pal,H.LV.strong.pal)+'</p></div>';
};

D.ach=function(a){
  var S=A.state,meas=S.meas,first=meas[0],last=meas[meas.length-1],gain=r1(last.h-first.h);
  var badges=[{n:t('bd.reg'),d:t('bd.regd'),ok:true,m:'1'},{n:t('bd.chk'),d:t('bd.chkd'),ok:meas.length>=2,m:'2'}];
  if(a.youth)badges.push({n:t('bd.who'),d:t('bd.whod'),ok:Math.abs(a.z)<=2,m:'SD'},{n:t('bd.med'),d:t('bd.medd'),ok:a.z>=0,m:'P50'});
  if(a.bs.k==='ok')badges.push({n:t('bd.bmi'),d:t('bd.bmid'),ok:true,m:'BMI'});
  if(a.growable)[1,2,3,5,8].forEach(function(g){badges.push({n:'+'+g+' '+t('u.cm'),d:t('bd.gaind'),ok:gain>=g,m:'+'+g})});
  var won=badges.filter(function(b){return b.ok}).length;
  var bhtml=badges.map(function(b){return '<div class="badge'+(b.ok?' on':'')+'"><span class="medal">'+b.m+'</span><b>'+b.n+'</b><span class="small muted">'+b.d+'</span><span class="pill '+(b.ok?'good':'neutral')+'" style="align-self:flex-start">'+t(b.ok?'bd.on':'bd.off')+'</span></div>'}).join('');
  var th='<th>'+t('ac.th')+'</th>'+ORDER.map(function(l){return '<th><span class="dot d-'+l+'"></span>'+A.lvName(l)+'</th>'}).join('');
  var cell=function(l,html){return '<td class="lv-'+l+(S.level===l?' sel':'')+' cell">'+html+'</td>'};
  var tables='';
  if(a.growable){
    var tg=H.gainTargets(a),sims=ORDER.map(function(l){return H.simulate(a,H.LV[l].f,tg)});
    var gr=tg.map(function(g,k){return '<tr><td><b>+'+g+' '+t('u.cm')+'</b><br><span class="small muted">'+t('ac.hgain',r1(last.h))+'</span></td>'+ORDER.map(function(l,j){var mo=sims[j][k];return cell(l,mo==null?'<span class="muted">-</span>':'<b>'+A.monthsLabel(mo)+'</b><br><span class="small muted">'+t('ac.by',A.dateLabel(mo))+'</span>')}).join('')+'</tr>'}).join('');
    tables+='<div class="stack" style="gap:10px"><div><h2>'+t('ac.ht')+'</h2><p class="muted small" style="margin-top:4px">'+t('ac.hsub')+'</p></div>'+
    '<div class="tablewrap"><table><thead><tr>'+th+'</tr></thead><tbody>'+gr+'</tbody></table></div><p class="note">'+t('ac.hnote',r1(a.vel))+'</p></div>';
  }else{
    tables+='<div class="card"><h2>'+t('ac.done.t')+'</h2><p class="muted" style="margin-top:6px">'+t('ac.done.d')+'</p></div>';
  }
  var hab=[['cons',[4,6,8],'un.weeks'],['sleep',[14,21,30],'un.nights'],['menu',[14,21,30],'un.days'],['post',[21,30,66],'un.days'],['who',[4,8,12],'un.weeks']];
  var hr=hab.map(function(h){return '<tr><td><b>'+t('hb.'+h[0])+'</b><br><span class="small muted">'+t('hb.'+h[0]+'d')+'</span></td>'+ORDER.map(function(l,j){return cell(l,'<b>'+t(h[2],h[1][j])+'</b>')}).join('')+'</tr>'}).join('');
  if(!a.youth&&a.bs.k!=='ok'){
    var d=a.bs.k==='under'?a.kgLow-a.m.w:a.m.w-a.kgHigh,rate=a.bs.k==='under'?[0.25,0.35,0.5]:[0.25,0.5,0.75];
    hr+='<tr><td><b>'+t('hb.bmi')+'</b><br><span class="small muted">'+t(a.bs.k==='under'?'hb.gain':'hb.lose',r1(d))+'</span></td>'+ORDER.map(function(l,j){var wk=Math.max(1,Math.ceil(d/rate[j]));return cell(l,'<b>'+A.monthsLabel(Math.max(1,Math.round(wk/4.345)))+'</b><br><span class="small muted">'+t('hb.rate',rate[j])+'</span>')}).join('')+'</tr>';
  }
  tables+='<div class="stack" style="gap:10px"><div><h2>'+t('ac.hab')+'</h2><p class="muted small" style="margin-top:4px">'+t('ac.habsub')+'</p></div><div class="tablewrap"><table><thead><tr>'+th+'</tr></thead><tbody>'+hr+'</tbody></table></div></div>';
  var hist=meas.slice().reverse().slice(0,6).map(function(m,i){var idx=meas.length-1-i;
    return '<div><span><span class="mono">'+m.date+'</span> &nbsp; <b class="mono">'+m.h+' '+t('u.cm')+'</b> &nbsp; <span class="muted mono">'+m.w+' '+t('u.kg')+'</span></span>'+(idx>0?'<button class="btn ghost sm" data-act="del" data-v="'+idx+'">'+t('lg.rm')+'</button>':'<span class="small muted">'+t('lg.first')+'</span>')+'</div>'}).join('');
  var log='<div class="card"><h3>'+t('lg.title')+'</h3><form id="log" class="row" style="margin-top:12px;align-items:flex-end" novalidate>'+
  '<label class="f" for="ldate" style="flex:1 1 140px">'+t('lg.date')+'<input id="ldate" type="date" value="'+H.ymd(new Date())+'" max="'+H.ymd(new Date())+'"></label>'+
  '<label class="f" for="lh" style="flex:1 1 110px">'+t('lg.h')+'<input id="lh" type="number" step="0.1" min="80" max="250" inputmode="decimal"></label>'+
  '<label class="f" for="lw" style="flex:1 1 110px">'+t('lg.w')+'<input id="lw" type="number" step="0.1" min="10" max="300" inputmode="decimal" placeholder="'+t('lg.opt')+'"></label>'+
  '<button class="btn" type="submit">'+t('lg.add')+'</button></form><p class="err" id="lerr" role="alert"></p><div class="hist">'+hist+'</div></div>';
  return '<div class="stack"><div class="card"><div class="row" style="justify-content:space-between"><div><span class="label">'+t('ac.badges')+'</span><h2>'+t('ac.unlocked',won,badges.length)+'</h2></div>'+
  (a.growable?'<div class="fact"><span class="label">'+t('ac.gain')+'</span><b>'+(gain>=0?'+':'')+gain+' '+t('u.cm')+'</b></div>':'')+'</div><div class="badges" style="margin-top:14px">'+bhtml+'</div></div>'+log+tables+'</div>';
};
})();

</script>
<script>
(function(){
'use strict';
var H=window.HH,A=window.APP,t=A.t,esc=A.esc,r1=H.r1,S=A.state,$=A.$;
var STEPS=['phone','name','about','body','review'];

/* ---------- Landing ---------- */

function landing(){

  return '<header class="top">'+A.brand+'<div class="row">'+A.langSwitch()+'<button class="btn sm" data-act="start">'+t('nav.start')+'</button></div></header>'+
  '<section class="hero"><div class="stack" style="gap:18px;min-width:0"><span class="label">'+t('land.eyebrow')+'</span><h1 class="hero-h">'+t('land.h1')+'</h1>'+

  '<div class="card"><h3>'+t('ch.title')+'</h3>'+A.chartSvg(a,pts)+'<p class="small muted">'+t('land.chartcap')+'</p></div></section>'+
  '<section id="how" class="sec"><h2>'+t('how.title')+'</h2><div class="grid" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">'+how+'</div></section>'+
  '<section class="sec"><h2>'+t('lvl.title')+'</h2><div class="grid" style="margin-top:16px">'+lv+'</div></section>'+
  '<section class="sec"><h2>'+t('feat.title')+'</h2><div class="grid feat" style="margin-top:16px">'+feat+'</div></section>'+
  '<section class="cta"><h2>'+t('land.final')+'</h2><button class="btn" data-act="start">'+t('land.cta')+'</button></section>'+
  '<footer class="disc"><p class="note">'+t('disc')+'</p><p class="small muted" style="margin-top:12px">'+t('foot')+'</p></footer>';
}

/* ---------- Wizard ---------- */
function validate(n){
  var w=S.wz,age,wt,ht;
  if(n===1)return H.fmtPhone(w.phone||'')?'':'e.phone';
  if(n===2)return (w.first||'').trim()&&(w.last||'').trim()?'':'e.name';
  if(n===3){
    if(!w.dob)return 'e.dob';
    age=H.ageAt(w.dob,new Date());
    if(!(age>=0)||age>100)return 'e.old';
    if(age<5)return 'e.young';
    return w.sex==='M'||w.sex==='F'?'':'e.sex';
  }
  if(n===4){
    wt=parseFloat(w.w);ht=parseFloat(w.h);
    if(!(wt>=10&&wt<=300))return 'e.weight';
    if(!(ht>=80&&ht<=250))return 'e.height';
    return '';
  }
  return validate(1)||validate(2)||validate(3)||validate(4);
}
function furthest(){for(var i=1;i<=4;i++)if(validate(i))return i;return 5}
function firstBad(){for(var i=1;i<=4;i++){var e=validate(i);if(e)return {step:i,err:e}}return null}

function preview(){
  var w=S.wz;
  var okAbout=!validate(3),okBody=okAbout&&!validate(4);
  if(!okAbout)return '<p class="muted">'+t('pv.empty')+'</p>';
  var p={dob:w.dob,sex:w.sex},age=H.ageAt(w.dob,new Date()),T=H.WHO[w.sex];
  var med=H.at(T.h,age),sd=H.at(T.sd,age),endAge=w.sex==='F'?17:19;
  var html='<dl class="kv" style="margin-top:0"><dt>'+t('prof.age')+'</dt><dd>'+age.toFixed(1)+'</dd>'+
    '<dt>'+t('pv.expect',age.toFixed(1))+'</dt><dd>'+Math.round(med-2*sd)+' – '+Math.round(med+2*sd)+' '+t('u.cm')+'</dd>'+
    '<dt>'+t('ov.median',age.toFixed(1))+'</dt><dd>'+r1(med)+' '+t('u.cm')+'</dd></dl>'+
    '<p class="small muted" style="margin-top:10px">'+(age<endAge?t('pv.grow',endAge):t('pv.done'))+'</p>';
  if(!okBody)return html+'<p class="note" style="margin-top:14px">'+t('pv.need')+'</p>';
  var a=H.analyze(p,{h:parseFloat(w.h),w:parseFloat(w.w)});
  html+='<hr class="sep"><div class="row" style="justify-content:space-between"><div><span class="label">'+t('pv.you')+'</span><p class="big">'+a.m.h+' '+t('u.cm')+'</p></div><span class="pill '+a.hs.c+'">'+t('hs.'+a.hs.k)+'</span></div>'+
    '<div class="row" style="justify-content:space-between;margin-top:12px"><div><span class="label">'+t('pv.bmi')+'</span><p class="big">'+a.bmi.toFixed(1)+'</p></div><span class="pill '+a.bs.c+'">'+t('bs.'+a.bs.k)+'</span></div>'+
    '<dl class="kv"><dt>'+t('ov.pct')+'</dt><dd>P'+a.pct+'</dd><dt>'+t('pv.healthy')+'</dt><dd>'+r1(a.kgLow)+' – '+r1(a.kgHigh)+' '+t('u.kg')+'</dd></dl>';
  var rec=H.recommended(a);
  html+='<div class="row" style="margin-top:12px"><span class="label">'+t('pv.suggest')+'</span><span class="pill neutral"><span class="dot d-'+rec+'" style="display:inline-block;margin:0 6px 0 0;vertical-align:middle"></span>'+A.lvName(rec)+'</span></div>';
  if(a.youth)html+='<div style="margin-top:14px">'+A.chartSvg(a,[{ag:Math.min(19,a.age),h:a.m.h}])+'</div>';
  return html;
}

function fieldsFor(step){
  var w=S.wz;
  var inp=function(id,key,type,label,extra){return '<label class="f" for="'+id+'">'+t(label)+'<input id="'+id+'" data-wz="'+key+'" type="'+type+'" value="'+esc(w[key]||'')+'" '+(extra||'')+'></label>'};
  if(step==='phone')return inp('phone','phone','tel','fl.phone','inputmode="tel" autocomplete="tel" placeholder="+998 90 123 45 67"');
  if(step==='name')return '<div class="fields">'+inp('first','first','text','fl.first','autocomplete="given-name"')+inp('last','last','text','fl.last','autocomplete="family-name"')+'</div>';
  if(step==='about')return '<div class="fields">'+inp('dob','dob','date','fl.dob','max="'+H.ymd(new Date())+'"')+
    '<div class="f"><span>'+t('fl.sex')+'</span><div class="radios"><label for="gM"><input type="radio" name="sex" id="gM" data-wz="sex" value="M"'+(w.sex==='M'?' checked':'')+'> '+t('fl.male')+'</label><label for="gF"><input type="radio" name="sex" id="gF" data-wz="sex" value="F"'+(w.sex==='F'?' checked':'')+'> '+t('fl.female')+'</label></div></div></div>';
  if(step==='body')return '<div class="fields">'+inp('weight','w','number','fl.weight','inputmode="decimal" step="0.1" min="10" max="300"')+inp('height','h','number','fl.height','inputmode="decimal" step="0.1" min="80" max="250"')+'</div>';
  var ph=H.fmtPhone(w.phone||'')||w.phone;
  return '<dl class="kv review"><dt>'+t('fl.phone')+'</dt><dd>'+esc(ph)+'</dd><dt>'+t('fl.first')+'</dt><dd>'+esc(w.first)+'</dd><dt>'+t('fl.last')+'</dt><dd>'+esc(w.last)+'</dd>'+
    '<dt>'+t('fl.dob')+'</dt><dd>'+esc(w.dob)+'</dd><dt>'+t('fl.sex')+'</dt><dd>'+t(w.sex==='F'?'fl.female':'fl.male')+'</dd><dt>'+t('fl.weight')+'</dt><dd>'+esc(w.w)+'</dd><dt>'+t('fl.height')+'</dt><dd>'+esc(w.h)+'</dd></dl>';
}

function wizard(){
  var w=S.wz,step=w.step,key=STEPS[step-1],far=furthest();
  var stepper=STEPS.map(function(k,i){var n=i+1,st=n===step?'cur':n<step?'done':'todo',can=n<=far||n<step;
    return '<button type="button" class="stp '+st+'" data-act="goto" data-v="'+n+'"'+(can?'':' disabled')+(n===step?' aria-current="step"':'')+'><span class="num-chip">'+(n<step?'✓':n)+'</span><span class="stp-l">'+t('st.'+k)+'</span></button>'}).join('');
  return '<header class="top">'+A.brand+'<div class="row">'+A.langSwitch()+'<button class="btn ghost sm" data-act="home">'+t('nav.home')+'</button></div></header>'+
  '<div class="stack" style="gap:8px;padding-block:6px 18px"><h1>'+t('wz.title')+'</h1><p class="muted" style="max-width:62ch">'+t('wz.sub')+'</p></div>'+
  '<div class="wz"><form class="card" id="wzf" novalidate><div class="stepper">'+stepper+'</div>'+
  '<div class="stack" style="gap:6px;margin-top:20px"><span class="label">'+t('wz.step',step,STEPS.length)+'</span><h2>'+t('st.'+key)+'</h2><p class="muted">'+t('st.'+key+'.d')+'</p></div>'+
  '<div style="margin-top:16px">'+fieldsFor(key)+'</div><p class="err" id="err" role="alert"></p>'+
  '<div class="row" style="margin-top:6px">'+(step>1?'<button type="button" class="btn ghost" data-act="back">'+t('wz.back')+'</button>':'')+
  (step<STEPS.length?'<button type="submit" class="btn">'+t('wz.next')+'</button>':'<button type="submit" class="btn">'+t('wz.create')+'</button>')+
  '<span style="flex:1"></span><button type="button" class="btn ghost sm" data-act="sample">'+t('wz.sample')+'</button><button type="button" class="btn ghost sm" data-act="clear">'+t('wz.clear')+'</button></div></form>'+
  '<aside class="card pv"><h3>'+t('pv.title')+'</h3><div id="pv" style="margin-top:12px">'+preview()+'</div></aside></div>'+
  '<footer class="disc"><p class="note">'+t('disc')+'</p></footer>';
}

/* ---------- Render ---------- */
function render(focus){
  var app=$('#app'),html,a;
  document.documentElement.lang=S.lang;
  if(S.screen==='dash'&&S.profile){
    a=H.analyze(S.profile,S.meas[S.meas.length-1]);
    if(!S.level)S.level=H.recommended(a);
    var body=S.tab==='training'?A.dash.training(a):S.tab==='feeding'?A.dash.feeding(a):S.tab==='ach'?A.dash.ach(a):S.tab==='tg'?A.dash.tg(a):A.dash.overview(a);
    html=A.dash.strip(a)+'<main>'+body+'</main>';
  }else if(S.screen==='register')html=wizard();
  else html=landing();
  app.innerHTML=html;
  if(focus){var f=app.querySelector('#wzf input:not([type=radio])');if(f&&f.type!=='date')f.focus()}
}
A.render=render;

function setErr(k){var e=$('#err');if(e)e.textContent=k?t(k):''}
function next(){
  var step=S.wz.step,e=validate(step);
  if(e){setErr(e);return}
  if(step<STEPS.length){S.wz.step=step+1;A.save();render(true);return}
  var bad=firstBad();
  if(bad){S.wz.step=bad.step;A.save();render(true);setErr(bad.err);return}
  var w=S.wz;
  S.profile={phone:H.fmtPhone(w.phone),first:w.first.trim(),last:w.last.trim(),dob:w.dob,sex:w.sex};
  S.meas=[{date:H.ymd(new Date()),h:r1(parseFloat(w.h)),w:r1(parseFloat(w.w))}];
  S.level=null;S.tab='tg';S.tg=null;S.screen='dash';S.wz=A.blankWz();A.ensureTg();
  A.save();render();window.scrollTo(0,0);
}

document.addEventListener('submit',function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==='wzf')next();
  else if(id==='log'){
    var date=$('#ldate').value,h=parseFloat($('#lh').value),w=parseFloat($('#lw').value),err=$('#lerr');
    if(!date||!(h>=80&&h<=250)){err.textContent=t('lg.err');return}
    if(date<S.profile.dob){err.textContent=t('lg.errdob');return}
    var prevW=S.meas[S.meas.length-1].w;
    S.meas.push({date:date,h:r1(h),w:w>=10&&w<=300?r1(w):prevW});
    S.meas.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0});
    A.save();render();
  }
});
function upPayload(){var p=$('#payload');if(p&&S.tg)p.textContent=A.tgPayload()}
function onInput(e){
  var el=e.target;
  if(el.id==='botname'){S.bot=el.value;A.save();var qb=$('#qrbox');if(qb)qb.innerHTML=A.qrHtml();return}
  var rk=el.getAttribute&&el.getAttribute('data-rem');
  if(rk&&S.tg){S.tg.rem[rk]=el.checked;A.save();upPayload();return}
  if(el.id==='remtime'&&S.tg){S.tg.time=el.value;A.save();upPayload();return}
  var k=el.getAttribute&&el.getAttribute('data-wz');
  if(!k)return;
  S.wz[k]=el.value;A.save();
  var pv=$('#pv');if(pv)pv.innerHTML=preview();
  var er=$('#err');if(er)er.textContent='';
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  if(act==='lang'){S.lang=v;A.save();render()}
  else if(act==='start'){S.screen='register';A.save();render(true);window.scrollTo(0,0)}
  else if(act==='home'){S.screen='landing';A.save();render();window.scrollTo(0,0)}
  else if(act==='scroll'){var el=document.getElementById(v);if(el)el.scrollIntoView({behavior:'smooth'})}
  else if(act==='goto'){var n=parseInt(v,10);if(n<=Math.max(furthest(),S.wz.step)){S.wz.step=n;A.save();render(true)}}
  else if(act==='back'){S.wz.step=Math.max(1,S.wz.step-1);A.save();render(true)}
  else if(act==='clear'){S.wz=A.blankWz();A.save();render(true)}
  else if(act==='sample'){
    var d=new Date();d.setFullYear(d.getFullYear()-14);d.setMonth(d.getMonth()-6);
    S.wz.phone='+998 90 123 45 67';S.wz.first='Aziz';S.wz.last='Karimov';S.wz.dob=H.ymd(d);S.wz.sex='M';S.wz.w='52';S.wz.h='161';
    A.save();render();
  }
  else if(act==='regen'){S.tg.code=A.newCode();A.save();render()}
  else if(act==='copy'){
    var sel=function(){var cb=$('#codebig');if(!cb)return;var r=document.createRange();r.selectNodeContents(cb);var sl=window.getSelection();sl.removeAllRanges();sl.addRange(r)};
    var done=function(){b.textContent=t('tg.copied')};
    try{navigator.clipboard.writeText(S.tg.code).then(done,sel)}catch(x){sel()}
  }
  else if(act==='tab'){S.tab=v;S.confirmReset=false;A.save();render()}
  else if(act==='level'){S.level=v;S.confirmReset=false;A.save();render()}
  else if(act==='del'){S.meas.splice(parseInt(v,10),1);A.save();render()}
  else if(act==='reset'){
    if(!S.confirmReset){S.confirmReset=true;render()}
    else{S.profile=null;S.meas=[];S.level=null;S.tab='overview';S.tg=null;S.confirmReset=false;S.wz=A.blankWz();S.screen='landing';A.save();render();window.scrollTo(0,0)}
  }
});
render();
})();

</script>
